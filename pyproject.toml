[project]
name = "maze-experiment-docker"
version = "1.0.0"
description = "The API server enabling the communication between the Maze3D game and the RL agents"
authors = [
    {name = "Dimitrios Koutrintzes", email = "dkoutrintzes@gmail.com"}
]
maintainers = []
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "environs>=14.3.0",
    "flask>=3.1.1",
    "flask-cors>=6.0.1",
    "gevent>=25.5.1",
    "gunicorn>=23.0.0",
]

[tool.black]
# Match Flake8's default
line-length = 79
preview = true

[tool.isort]
# Match black's default
profile = "black"

[tool.ruff]
line-length = 79
# E: pycodestyle
# F: pyflakes
# W: warnings
# I: isort
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "deepdiff>=8.4.2",
    "pip>=25.0.1",
    "pre-commit>=4.0.1",
    "pytest>=8.4.1",
    "ruff>=0.11.2",
]
